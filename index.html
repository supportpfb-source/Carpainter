<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ستار وڈ ورکس — کچن اور ہوم ڈیکوریشن کارپینٹر، کراچی</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&family=Noto+Nastaliq+Urdu:wght@400..700&family=Noto+Sans+Urdu:wght@400..700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<style>
  :root{
    --cream:#F5F0E6;
    --cream-2:#EDE4D3;
    --walnut:#241812;
    --walnut-soft:#3A2A20;
    --copper:#A8592D;
    --copper-deep:#8A4622;
    --text-muted:#6B5D4F;
    --line:#DDD2BC;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    background:var(--cream);
    color:var(--walnut);
    font-family:'Noto Sans Urdu','Work Sans',sans-serif;
    line-height:2;
    direction:rtl;
    text-align:right;
  }
  body.lang-en{
    font-family:'Work Sans',sans-serif;
    line-height:1.65;
    direction:ltr;
    text-align:left;
  }
  h1,h2,h3,h4,h5{
    font-family:'Noto Nastaliq Urdu',serif;
    font-weight:600;
    color:var(--walnut);
    line-height:2.3;
  }
  body.lang-en h1, body.lang-en h2, body.lang-en h3, body.lang-en h4, body.lang-en h5{
    font-family:'Fraunces',serif;
    line-height:1.15;
  }
  .navbar-brand, .footer-logo, .dev-name{font-family:'Noto Nastaliq Urdu',serif;}
  body.lang-en .navbar-brand, body.lang-en .footer-logo, body.lang-en .dev-name{font-family:'Fraunces',serif;}
  a{color:inherit;}
  .text-muted-warm{color:var(--text-muted)!important;}
  .bg-cream2{background:var(--cream-2);}
  .bg-walnut{background:var(--walnut)!important;}
  .text-copper{color:var(--copper)!important;}
  .btn-copper{background:var(--copper);border-color:var(--copper);color:#fff;}
  .btn-copper:hover{background:var(--copper-deep);border-color:var(--copper-deep);color:#fff;}
  .btn-outline-walnut{border:1px solid var(--walnut);color:var(--walnut);}
  .btn-outline-walnut:hover{background:var(--walnut);color:var(--cream);}
  .section-kicker{font-size:.9rem;color:var(--copper-deep);font-weight:600;letter-spacing:.3px;}
  .rounded-2{border-radius:4px;}

  /* ===== Lang switch button ===== */
  .lang-switch{
    display:inline-flex;border:1px solid var(--walnut);border-radius:20px;overflow:hidden;
  }
  .lang-switch button{
    border:none;background:transparent;color:var(--walnut);
    padding:.32rem .85rem;font-size:.8rem;font-weight:600;cursor:pointer;
    font-family:'Work Sans',sans-serif;
  }
  .lang-switch button.active{background:var(--walnut);color:var(--cream);}

  /* ===== Template top notice ===== */
  .notice-bar{
    background:var(--walnut);color:var(--cream);
    font-size:.85rem;padding:.55rem 0;
  }
  .notice-bar a{color:#E8B98C;text-decoration:underline;}

  /* ===== Navbar ===== */
  .navbar-brand{font-weight:700;font-size:1.4rem;line-height:1.3;color:var(--walnut)!important;}
  .navbar-brand small{display:block;font-family:'Noto Sans Urdu','Work Sans',sans-serif;font-size:.68rem;font-weight:500;color:var(--text-muted);letter-spacing:.2px;}
  body.lang-en .navbar-brand small{font-family:'Work Sans',sans-serif;font-size:.62rem;}
  .navbar{background:rgba(245,240,230,.94)!important;backdrop-filter:blur(6px);border-bottom:1px solid var(--line);}
  .nav-link{color:var(--walnut-soft)!important;font-weight:500;}
  .nav-link:hover{color:var(--copper)!important;}

  /* ===== Hero ===== */
  .hero{padding:5.5rem 0 5rem;}
  .hero h1{font-size:2.6rem;}
  body.lang-en .hero h1{font-size:3rem;letter-spacing:-.5px;}
  .hero .lead{color:var(--text-muted);max-width:50ch;}
  .hero-img-wrap{position:relative;}
  .hero-img-wrap img{height:480px;object-fit:cover;border-radius:4px;width:100%;}
  .float-card{
    position:absolute;left:-16px;bottom:-20px;max-width:250px;
    background:var(--walnut);color:var(--cream);padding:1.1rem 1.3rem;
    box-shadow:0 18px 40px rgba(36,24,18,.28);border-radius:3px;
  }
  body.lang-en .float-card{left:-16px;right:auto;}
  html[dir="rtl"] .float-card{left:auto;right:-16px;}
  .float-card b{color:#E8B98C;font-family:'Noto Nastaliq Urdu',serif;font-size:1.05rem;display:block;margin-bottom:2px;}
  body.lang-en .float-card b{font-family:'Fraunces',serif;font-size:.95rem;}
  .float-card span{font-size:.82rem;color:#D8CDBF;}
  .stat b{font-family:'Noto Nastaliq Urdu',serif;font-size:1.7rem;color:var(--copper-deep);display:block;}
  body.lang-en .stat b{font-family:'Fraunces',serif;font-size:1.6rem;}
  .stat span{font-size:.8rem;color:var(--text-muted);}

  /* ===== Service cards ===== */
  .service-card{
    background:var(--cream);border:1px solid var(--line);padding:2rem 1.75rem;height:100%;border-radius:3px;
    transition:border-color .2s ease, transform .2s ease;
  }
  .service-card:hover{border-color:var(--copper);transform:translateY(-3px);}
  .service-card .icon{font-size:1.5rem;color:var(--copper);margin-bottom:1rem;}

  /* ===== Portfolio ===== */
  .project-card{border-radius:4px;overflow:hidden;position:relative;height:100%;cursor:pointer;}
  .project-card img{width:100%;height:100%;object-fit:cover;min-height:260px;transition:transform .5s ease;}
  .project-card:hover img{transform:scale(1.06);}
  .project-card .overlay{
    position:absolute;left:0;right:0;bottom:0;padding:1.1rem 1.2rem 1rem;
    background:linear-gradient(to top, rgba(36,24,18,.9), rgba(36,24,18,0));
    color:#fff;
  }
  .project-card .overlay b{font-family:'Noto Nastaliq Urdu',serif;font-size:1.15rem;display:block;}
  body.lang-en .project-card .overlay b{font-family:'Fraunces',serif;font-size:1.02rem;}
  .project-card .overlay span{font-size:.8rem;color:#E4D9C8;}
  .project-card .zoom-hint{
    position:absolute;top:14px;left:14px;
    width:34px;height:34px;border-radius:50%;
    background:rgba(245,240,230,.92);color:var(--walnut);
    display:flex;align-items:center;justify-content:center;font-size:1rem;
  }
  html[dir="rtl"] .project-card .zoom-hint{left:auto;right:14px;}
  .badge-cat{
    position:absolute;top:14px;right:14px;
    background:rgba(245,240,230,.92);color:var(--walnut);
    font-size:.72rem;font-weight:600;padding:.3rem .65rem;border-radius:20px;
  }
  html[dir="rtl"] .badge-cat{right:auto;left:14px;}

  /* Lightbox modal */
  #imageModal .modal-content{background:var(--walnut);border:none;border-radius:6px;}
  #imageModal .modal-header{border-bottom:1px solid rgba(245,240,230,.15);}
  #imageModal .modal-title{color:var(--cream);font-family:'Noto Nastaliq Urdu',serif;font-size:1.3rem;}
  body.lang-en #imageModal .modal-title{font-family:'Fraunces',serif;}
  #imageModal .modal-body{padding:0;}
  #imageModal img{width:100%;max-height:70vh;object-fit:cover;}
  #imageModal .modal-footer{border-top:1px solid rgba(245,240,230,.15);color:#D8CDBF;font-size:.9rem;}
  #imageModal .btn-close{filter:invert(1) grayscale(100%) brightness(200%);}

  /* ===== Process ===== */
  .process-num{font-family:'Noto Nastaliq Urdu',serif;font-size:2.3rem;color:var(--copper);}
  body.lang-en .process-num{font-family:'Fraunces',serif;font-size:2.1rem;}

  /* ===== Areas ===== */
  .area-pill{
    border:1px solid var(--line);padding:.5rem 1.1rem;font-size:.9rem;border-radius:20px;
    color:var(--walnut-soft);background:var(--cream);display:inline-block;
  }
  .area-pill.on{background:var(--walnut);color:var(--cream);border-color:var(--walnut);}

  /* ===== Testimonials ===== */
  .testi-card{background:var(--cream);border:1px solid var(--line);padding:1.9rem 1.7rem;border-radius:3px;height:100%;}
  .testi-card .quote{color:var(--walnut-soft);font-size:1rem;}

  /* ===== Contact ===== */
  .contact-form input,.contact-form textarea{
    background:rgba(245,240,230,.06);border:1px solid rgba(245,240,230,.28);color:var(--cream);
    border-radius:3px;
  }
  .contact-form input::placeholder,.contact-form textarea::placeholder{color:#B7AC9C;}
  .contact-form input:focus,.contact-form textarea:focus{
    background:rgba(245,240,230,.1);border-color:var(--copper);color:var(--cream);box-shadow:none;
  }
  .contact-info-item{border-bottom:1px solid rgba(245,240,230,.15);padding:1.05rem 0;}
  .contact-info-item b{display:block;font-size:.98rem;}
  .contact-info-item span{font-size:.85rem;color:#D8CDBF;}

  /* ===== Developer / Template banner ===== */
  .dev-banner{
    background:rgba(168,89,45,.14);
    border:1px dashed rgba(232,185,140,.55);
    border-radius:4px;
  }
  .dev-banner h5{color:#E8B98C;}
  .dev-banner .dev-name{font-size:1.2rem;color:var(--cream);}
  .dev-banner .dev-phone{font-size:1.05rem;color:#E8B98C;font-weight:700;}

  footer{background:#1B120D;color:#C9BCA9;}
  footer h6{color:var(--cream);font-weight:600;}
  footer a{color:#B4A692;text-decoration:none;}
  footer a:hover{color:#E8B98C;}
  .footer-logo{color:var(--cream);font-size:1.4rem;}

  @media (max-width:767.98px){
    .hero h1{font-size:1.9rem;}
    .hero-img-wrap img{height:300px;}
    .float-card{position:static;margin-top:1rem;max-width:100%;}
  }
</style>
</head>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
  var currentLang = 'ur';

  function setLang(lang){
    currentLang = lang;
    document.documentElement.lang = lang;
    document.documentElement.dir = lang === 'ur' ? 'rtl' : 'ltr';
    document.body.classList.toggle('lang-en', lang === 'en');

    document.querySelectorAll('.i18n').forEach(function(el){
      var text = lang === 'ur' ? el.getAttribute('data-ur') : el.getAttribute('data-en');
      if(text !== null){ el.textContent = text; }
    });
    document.querySelectorAll('.i18n-ph').forEach(function(el){
      var text = lang === 'ur' ? el.getAttribute('data-ur-ph') : el.getAttribute('data-en-ph');
      if(text !== null){ el.setAttribute('placeholder', text); }
    });

    document.getElementById('btnUr').classList.toggle('active', lang === 'ur');
    document.getElementById('btnEn').classList.toggle('active', lang === 'en');
  }

  function openLightbox(src, titleEn, titleUr, capEn, capUr){
    document.getElementById('modalImage').src = src;
    document.getElementById('modalTitle').textContent = currentLang === 'ur' ? titleUr : titleEn;
    document.getElementById('modalCaption').textContent = currentLang === 'ur' ? capUr : capEn;
    var modal = new bootstrap.Modal(document.getElementById('imageModal'));
    modal.show();
  }

  document.addEventListener('DOMContentLoaded', function(){
    setLang('ur');
  });
</script>
